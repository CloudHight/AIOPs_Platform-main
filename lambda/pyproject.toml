[project]
name = "aiops-lambda"
version = "0.1.0"
description = "AIOps Lambda control plane package"
requires-python = ">=3.9"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
strict_optional = true

dependencies = [
  "boto3>=1.34",
  "botocore>=1.34",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
